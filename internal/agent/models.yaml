# Per-provider tier table. Each tier (fast / balanced / strong) baked
# into a deployment-tunable model + operational knobs. Agents declare
# routing intent via per-agent frontmatter `models:` priority lists
# (e.g. `[{provider: anthropic, tier: balanced}, {provider: googleai,
# tier: strong}]`); the executor walks the list at dispatch time and
# resolves the first preference whose provider is configured against
# this table.
#
# This file is embedded in the locutus binary; `locutus update`
# refreshes it when SDKs pull in new model names. Override per-project
# by editing `.borg/models.yaml`, or globally via
# `LOCUTUS_MODELS_CONFIG=/path/to/file.yaml`.
#
# Knobs:
#   model                — concrete provider-side model string the
#                          adapter passes to its SDK as-is.
#   max_output_tokens    — caps the model's response length. Adapters
#                          substitute a safe minimum when the API
#                          rejects 0 (Anthropic).
#   concurrent_requests  — per-(provider, model) semaphore cap. Bound
#                          fanout-shaped workloads (one elaborator
#                          per outline node) below provider RPM
#                          ceilings without coordination across the
#                          workflow. Zero = unbounded.
#
# Tier no longer carries a thinking knob — reasoning mode is a per-agent
# concern, declared in each agent's frontmatter (`thinking: off|on|high`).
# Tier picks the model strength; the agent decides whether to reason.

providers:
  anthropic:
    fast:
      model: claude-haiku-4-5-20251001
      max_output_tokens: 8192
      concurrent_requests: 10
    balanced:
      model: claude-sonnet-4-6
      max_output_tokens: 16384
      concurrent_requests: 12
    strong:
      model: claude-opus-4-7
      max_output_tokens: 32768
      concurrent_requests: 8

  googleai:
    fast:
      model: gemini-3.1-flash-lite-preview
      max_output_tokens: 16384
      concurrent_requests: 10
    balanced:
      model: gemini-3-flash-preview
      max_output_tokens: 32768
      concurrent_requests: 12
    strong:
      model: gemini-3.1-pro-preview
      max_output_tokens: 65536
      concurrent_requests: 8

  openai:
    fast:
      model: gpt-5-mini
      max_output_tokens: 8192
      concurrent_requests: 10
    balanced:
      model: gpt-5
      max_output_tokens: 16384
      concurrent_requests: 12
    strong:
      model: o3-pro
      max_output_tokens: 32768
      concurrent_requests: 8

# DJ-130 retired the dispatcher-side `format_providers:` rotation
# that used to live here. Each provider adapter
# (internal/agent/adapters/{anthropic,gemini,openai_responses}.go)
# now handles its own thinking + schema split against its own provider's
# `fast:` tier above (Anthropic Haiku for Claude reasoning; Gemini
# Flash-Lite for Gemini reasoning; gpt-5-mini for gpt-5 reasoning) —
# no cross-provider rotation for the format pass. A stale
# `format_providers:` block left in a user-edited models.yaml is
# silently ignored by the parser.
