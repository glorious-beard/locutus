# Locutus hooks for Codex on the spec_refinement activity.
#
# Generated by the Locutus publisher (DJ-136 phase 5); re-emitted
# on every `locutus update --reset`. These tables are appended to
# `.codex/config.toml` alongside the MCP server registration.
#
# PreToolUse on `mcp__locutus__spec_propose_decision` runs the
# `locutus hook-validate-decision` subcommand to enforce the
# DJ-133 id-shape invariant before the call lands. Decisions with
# malformed ids (missing `dec-` prefix, axes/suffix mismatch) are
# rejected mechanically rather than relying on the orchestrator
# to honor the prose contract.

[[hooks]]
event = "PreToolUse"
matcher = "mcp__locutus__spec_propose_decision"
command = "{{LOCUTUS_BIN}}"
args = ["hook-validate-decision"]
